<!-- wp:gt-page-block/page-block {"blockId":0,"blockSlug":"","name":"Civic Hearth questions","content":"\u003csection class=\u0022cwh-section\u0022 id=\u0022cwh-questions\u0022 aria-labelledby=\u0022cwh-questions-title\u0022\u003e\u003cdiv class=\u0022cwh-inner cwh-faq-grid\u0022\u003e\u003cdiv class=\u0022cwh-heading\u0022\u003e\u003ch2 id=\u0022cwh-questions-title\u0022\u003eA few useful answers.\u003c/h2\u003e\u003cp\u003eWhat the theme includes, how to edit it, and how its free update key works.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022cwh-faq-list\u0022\u003e\u003cdetails\u003e\u003csummary\u003eWhat does hybrid mean here?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-plus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-minus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cdiv class=\u0022cwh-faq-answer\u0022\u003e\u003cp\u003eCivic Hearth uses classic PHP templates, menus, widgets, and the Customizer alongside the WordPress block editor, theme.json styling, and native patterns. It does not replace the Customizer with the full Site Editor.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eIs the whole theme free?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-plus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-minus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cdiv class=\u0022cwh-faq-answer\u0022\u003e\u003cp\u003eYes. Every theme feature is included in the free download. The license is GPL-2.0-or-later, and there is no recurring fee for the theme or its lifetime update key.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eHow do free updates work?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-plus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-minus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cdiv class=\u0022cwh-faq-answer\u0022\u003e\u003cp\u003eComplete the free checkout to receive a lifetime key for unlimited websites. Add it under Appearance \u003e Civic Hearth License in your WordPress dashboard. WordPress can then check for theme updates. All theme features work without a key.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eDoes it need a page builder?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-plus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpat ler icons-tabler-outline icon-tabler-minus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cdiv class=\u0022cwh-faq-answer\u0022\u003e\u003cp\u003eThe theme includes working WordPress search and information layouts. Use an appropriate plugin or service for form delivery, payments, event management, or transactional public services.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eWhat does update activation send?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-plus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003csvg\n  xmlns=\u0022http://www.w3.org/2000/svg\u0022\n  width=\u002224\u0022\n  height=\u002224\u0022\n  viewBox=\u00220 0 24 24\u0022\n  fill=\u0022none\u0022\n  stroke=\u0022currentColor\u0022\n  stroke-width=\u00222\u0022\n  stroke-linecap=\u0022round\u0022\n  stroke-linejoin=\u0022round\u0022\n  class=\u0022icon icon-tabler icons-tabler-outline icon-tabler-minus\u0022\n\u003e\n  \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e\n  \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e\n\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cdiv class=\u0022cwh-faq-answer\u0022\u003e\u003cp\u003eActivating a key sends the key, theme version, and website address securely to gauravtiwari.org. Subsequent license checks use the saved activation. This connection is used for license verification and theme update delivery.\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e","css":"","js":"","format":false,"output":"inline"} /-->
